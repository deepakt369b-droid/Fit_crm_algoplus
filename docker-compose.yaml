services:
  app:
    build: .
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: web
    env_file:
      - .env
    ports:
      - "80:80"
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      - mysql
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  queue:
    build: .
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: queue
    env_file:
      - .env
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      - app
      - mysql
      - redis

  scheduler:
    build: .
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: scheduler
    env_file:
      - .env
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      - app
      - mysql
      - redis

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-fitcrm}
      MYSQL_USER: ${DB_USERNAME:-fitcrm}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  storage:
  mysql-data:
  redis-data:
